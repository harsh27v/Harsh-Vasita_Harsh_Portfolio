<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="#home" aria-label="Harsh Vasita home">
                <img src="images/logo.png" alt="Harsh Vasita">
            </a>
            <nav class="desktop-nav" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#about">About</a>
            </nav>
            <a class="contact-link" href="#contact">Contact <span>↗</span></a>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#about">About</a>
            <a class="contact-link" href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="hero full-width-grid-con">
            <h1 class="hidden">Hero Section</h1>
            <div class="box col-span-full">Hero Image</div>
        </section>
    </main>
    <!-- video -->
     <section class="welcome-section">
        <div class="grid-con center-grid-con">
            <div class="welcome-video col-span-full m-col-start-1 m-col-end-8 l-col-start-1 l-col-end-8">
                <video id="player1" playsinline preload="metadata" poster="video/reel.mp4">
                    <source src="video/reel.mp4" type="video/mp4">
                    <source src="video/reel.webm" type="video/webm">
                    <p>Your browser does not support HTML5 Video.</p>
                </video>
            </div>
            <div class="welcome-content col-span-full m-col-start-8 m-col-end-13 l-col-start-8 l-col-end-13">
                <div class="box">Welcome Content</div>
            </div>
        </div>
    </section>


<script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>
<script src="js/main.js" defer></script>
</body>
</html>
